<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-box">
        <h2>Formulir Pendaftaran</h2>
        
        <form action="detail.html" method="get" id="form-pendaftaran">
            
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <span class="label-title">Jenis Kelamin:</span>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="Laki-laki" checked>
                    <label for="male">Laki-laki</label>
                    <input type="radio" id="female" name="gender" value="Perempuan">
                    <label for="female">Perempuan</label>
                </div>
            </div>

            <div class="form-group">
                <label for="prodi">Program Studi:</label>
                <select id="prodi" name="prodi">
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Teknik Biomedis">Teknik Biomedis</option>
                    <option value="Teknik Mesin">Teknik Mesin</option>
                    <option value="Teknik Elektro">Teknik Elektro</option>
                    <option value="Teknik Sipil">Teknik Sipil</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Daftar Sekarang</button>
        </form>
    </div>
</body>
</html>
